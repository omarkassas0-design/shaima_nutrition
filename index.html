<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Cpath d='M16 7c-3 0-5 2-5 5 0 2 1 3 1 5s-1 4-1 6c0 1 1 2 2 2s2-1 2-3 1-4 1-4 1 2 1 4 1 3 2 3 2-1 2-2c0-2-1-4-1-6s1-3 1-5c0-3-2-5-5-5z' fill='white'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <!-- Apply the saved language and text direction BEFORE the app mounts, so an
         Arabic user never sees a left-to-right flash and RTL layout is correct
         from the very first paint. -->
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('auradental_lang') || 'en';
          if (lang !== 'ar' && lang !== 'en' && lang !== 'tr') lang = 'en';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="AuraDental Cloud is a secure, cloud-based practice management platform for modern dental clinics — patient records, scheduling, 3D dental charting, billing, and reports in one multilingual workspace." />
    <meta name="keywords" content="dental clinic management software, dental practice management, cloud dental software, patient records, dental scheduling, dental billing, multi-clinic, multilingual" />
    <meta name="author" content="AuraDental Cloud" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://auradentalcloud.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AuraDental Cloud" />
    <meta property="og:title" content="AuraDental Cloud — Cloud-Based Dental Practice Management" />
    <meta property="og:description" content="Run your dental clinic beautifully. Patient records, scheduling, 3D charting, billing, and reports in one secure, multilingual cloud platform." />
    <meta property="og:url" content="https://auradentalcloud.com" />
    <meta property="og:image" content="/assets/brand.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta property="og:locale:alternate" content="tr_TR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuraDental Cloud — Cloud-Based Dental Practice Management" />
    <meta name="twitter:description" content="Run your dental clinic beautifully. One secure, multilingual cloud platform for patients, scheduling, charting, billing, and reports." />
    <meta name="twitter:image" content="/assets/brand.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/auradental-icon-512.png" />

    }
    </script>
